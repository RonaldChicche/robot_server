      j1:             { kind: "holding", fc: 16, addr: 156, dtype: "int16" }
      j2:             { kind: "holding", fc: 16, addr: 157, dtype: "int16" }
      j3:             { kind: "holding", fc: 16, addr: 158, dtype: "int16" }
      j4:             { kind: "holding", fc: 16, addr: 159, dtype: "int16" }
      j5:             { kind: "holding", fc: 16, addr: 160, dtype: "int16" }
      j6:             { kind: "holding", fc: 16, addr: 161, dtype: "int16" }

    robot2:
      state_green:      { kind: "holding", fc: 6, addr: 200, dtype: "uint16" }
