modbus:
  mode: "tcp"            
  host: "190.168.10.108"   
  port: 5020              
  unit_id: 1             

  word_order: "high_low"   # "high_low" | "low_high"
  byte_order: "BIG"        # "big" | "little"

opc_nodes:               
  read:                  
    start_button:
      type: "method"
      name: "start_button"
      debounce_ms: 50
      modbus: { kind: "coil", fc: 1, addr: 10, length: 1, dtype: "bool" }

    pause_button:
      type: "method"
      name: "pause_button"
      debounce_ms: 50
      modbus: { kind: "coil", fc: 1, addr: 11, length: 1, dtype: "bool" }

    stop_button:
      type: "method"
      name: "stop_button"
      debounce_ms: 50
      modbus: { kind: "coil", fc: 1, addr: 12, length: 1, dtype: "bool" }

    clear_alarm_button:
      type: "method"
      name: "clear_alarm_button"
      debounce_ms: 50
      modbus: { kind: "coil", fc: 1, addr: 13, length: 1, dtype: "bool" }

    resume_button:
      type: "method"
      name: "resume_proceso_01"
      debounce_ms: 50
      modbus: { kind: "coil", fc: 1, addr: 14, length: 1, dtype: "bool" }

    test_bit:
      type: "method"
      name: "proceso_03"
      debounce_ms: 50
      modbus: { kind: "coil", fc: 1, addr: 15, length: 1, dtype: "bool" }

    jog_z:
      type: "method"
      name: "proceso_04"
      debounce_ms: 50
      modbus: { kind: "coil", fc: 1, addr: 16, length: 1, dtype: "bool" }

    standby:
      type: "method"
      name: "proceso_05"
      debounce_ms: 50
      modbus: { kind: "coil", fc: 1, addr: 17, length: 1, dtype: "bool" }

    gripper_off:
      type: "method"
      name: "proceso_06"
      debounce_ms: 50
      modbus: { kind: "coil", fc: 1, addr: 18, length: 1, dtype: "bool" }

    send_data:
      type: "proceso"
      name: "send_data" 
      debounce_ms: 50
      modbus: { kind: "coil", fc: 1, addr: 19, length: 1, dtype: "bool" }
    
    bit_stack:
      type: "bridge"
      name: "modify_output_y"
      debounce_ms: 50
      param: { output_id: "42", value: false }
      modbus: { kind: "coil", fc: 1, addr: 61, length: 1, dtype: "bool" }

    long_caja:
      type: "data"
      val: 0
      modbus: { kind: "holding", fc: 3, addr: 10, length: 1, dtype: "uint16" }

    ancho_caja:
      type: "data"
      val: 0
      modbus: { kind: "holding", fc: 3, addr: 11, length: 1, dtype: "uint16" }

    altura_caja:
      type: "data"
      val: 0
      modbus: { kind: "holding", fc: 3, addr: 12, length: 1, dtype: "uint16" }

    long_barra:
      type: "data"
      val: 0
      modbus: { kind: "holding", fc: 3, addr: 13, length: 1, dtype: "uint16" }

    ancho_barra:
      type: "data"
      val: 0
      modbus: { kind: "holding", fc: 3, addr: 14, length: 1, dtype: "uint16" }

    espesor:
      type: "data"
      val: 0
      modbus: { kind: "holding", fc: 3, addr: 15, length: 1, dtype: "uint16" }

    peso:
      type: "data"
      val: 0
      modbus: { kind: "holding", fc: 3, addr: 16, length: 1, dtype: "uint16" }

    cantidad_x:
      type: "data"
      val: 0
      modbus: { kind: "holding", fc: 3, addr: 17, length: 1, dtype: "uint16" }

    cantidad_z:
      type: "data"
      val: 0
      modbus: { kind: "holding", fc: 3, addr: 18, length: 1, dtype: "uint16" }

    no_carro:
      type: "data"
      val: 0
      modbus: { kind: "holding", fc: 3, addr: 19, length: 1, dtype: "uint16" }

    w1:
      type: "data"
      val: 0
      modbus: { kind: "holding", fc: 3, addr: 20, length: 1, dtype: "uint16" }

    w2:
      type: "data"
      val: 0
      modbus: { kind: "holding", fc: 3, addr: 21, length: 1, dtype: "uint16" }

  write:
    robot1:
      state_green:      { kind: "holding", fc: 6, addr: 100, dtype: "uint16" }
      state_yellow:    { kind: "holding", fc: 6, addr: 101, dtype: "uint16" }
