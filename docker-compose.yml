  opc-to-kafka:
    build: ./opc_gateway
    container_name: opc_to_kafka
    network_mode: "host"
    #restart: always
    environment:
      - MODE=opc_to_kafka
      - OPC_ENDPOINT=${OPC_ENDPOINT}
      - KAFKA_IP=${KAFKA_IP}
      - KAFKA_PORT=${KAFKA_PORT}
      - KAFKA_TOPIC_COMMANDS=${KAFKA_TOPIC_COMMANDS}
      - KAFKA_TOPIC_STATUS=${KAFKA_TOPIC_STATUS}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID_OPC}
    # volumes:
    #   - ./opc_gateway/config:/app/config
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    image: redis:alpine
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  socket_command_listener:
    build: ./socket_gateway
    container_name: socket_command_listener
    network_mode: "host"
    #restart: always
    environment:
      - MODE=command_listener
      - KAFKA_BROKER=${KAFKA_BROKER}
      - KAFKA_TOPIC_COMMANDS=${KAFKA_TOPIC_COMMANDS}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID_SOCKET}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    volumes:
      - ./socket_gateway:/app
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  socket_status:
    build: ./socket_gateway
    container_name: socket_status
    network_mode: "host"
    #restart: always
    environment:
      - MODE=status
      - KAFKA_BROKER=${KAFKA_BROKER}
      - KAFKA_TOPIC_STATUS=${KAFKA_TOPIC_STATUS}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - STATUS_INTERVAL=${STATUS_INTERVAL}
    volumes:
      - ./socket_gateway:/app
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
  
  socket_gateway_01:
    build: ./socket_gateway
    container_name: socket_gateway_01
    network_mode: "host"
    #restart: always
    environment:
      - MODE=gateway_robot
      - ROBOT_ID=${BORUNTE_01_ID}
      - BORUNTE_IP=${BORUNTE_01_IP}
      - BORUNTE_PORT=${BORUNTE_01_SOCKET_PORT}
