networks:
  app-tier:
    driver: bridge
  

services:
  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 60
    networks:
      - app-tier
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=${KAFKA_CFG_NODE_ID}
      - KAFKA_CFG_PROCESS_ROLES=${KAFKA_CFG_PROCESS_ROLES}
      - KAFKA_CFG_LISTENERS=${KAFKA_CFG_LISTENERS}
      - KAFKA_CFG_ADVERTISED_LISTENERS=${KAFKA_CFG_ADVERTISED_LISTENERS}
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=${KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP}
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=${KAFKA_CFG_CONTROLLER_QUORUM_VOTERS}
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=${KAFKA_CFG_CONTROLLER_LISTENER_NAMES}
      - ALLOW_PLAINTEXT_LISTENER=${ALLOW_PLAINTEXT_LISTENER}
      - KAFKA_KRAFT_CLUSTER_ID=${KAFKA_KRAFT_CLUSTER_ID}
  
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    networks:
      - app-tier
    environment:
      - KAFKA_CLUSTERS_0_NAME=${KAFKA_CLUSTERS_0_NAME}
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=${KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS}
    depends_on:
      kafka:
        condition: service_healthy

  opc-gateway:
    build: ./opc_gateway
    container_name: opc_gateway
    network_mode: "host"
    #restart: always
    environment:
      - MODE=${MODE_OPC_GATEWAY}
      - OPC_ENDPOINT=${OPC_ENDPOINT}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID_OPC}
      - KAFKA_BROKER=${KAFKA_BROKER}
      - KAFKA_TOPIC_COMMANDS=${KAFKA_TOPIC_COMMANDS}
      - KAFKA_TOPIC_STATUS=${KAFKA_TOPIC_STATUS}
    volumes:
      - ./opc_gateway:/app
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    image: redis:alpine
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  socket_command:
    build: ./socket_gateway
    container_name: socket_command
    network_mode: "host"
    #restart: always
    environment:
      - MODE=command_listener
      - KAFKA_BROKER=${KAFKA_BROKER}
      - KAFKA_TOPIC_COMMANDS=${KAFKA_TOPIC_COMMANDS}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID_SOCKET}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    volumes:
      - ./socket_gateway:/app
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  socket_status:
    build: ./socket_gateway
    container_name: socket_status
    network_mode: "host"
    #restart: always
    environment:
      - MODE=status
      - KAFKA_BROKER=${KAFKA_BROKER}
      - KAFKA_TOPIC_STATUS=${KAFKA_TOPIC_STATUS}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - STATUS_INTERVAL=${STATUS_INTERVAL}
    volumes:
      - ./socket_gateway:/app
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
  
  socket_gateway_01:
    build: ./socket_gateway
    container_name: socket_gateway_01
    network_mode: "host"
    #restart: always
    environment:
      - MODE=gateway_robot
      - ROBOT_ID=${BORUNTE_01_ID}
      - BORUNTE_IP=${BORUNTE_01_IP}
      - BORUNTE_PORT=${BORUNTE_01_SOCKET_PORT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    volumes:
      - ./socket_gateway:/app
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  socket_gateway_02:
    build: ./socket_gateway
    container_name: socket_gateway_02
    network_mode: "host"
    #restart: always
    environment:
      - MODE=gateway_robot
      - ROBOT_ID=${BORUNTE_02_ID}
      - BORUNTE_IP=${BORUNTE_02_IP}
      - BORUNTE_PORT=${BORUNTE_02_SOCKET_PORT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    volumes:
      - ./socket_gateway:/app
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres-db:
    image: postgres:15
    container_name: robot_config_db
    environment:
      POSTGRES_USER: robotadmin
      POSTGRES_PASSWORD: secretpass
      POSTGRES_DB: robot_config
    volumes:
      - db_robot_data:/var/lib/postgresql/data
    networks:
      - app-tier

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@robotica.io
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres-db
    networks:
      - app-tier

